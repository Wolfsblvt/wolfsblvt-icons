name: Publish package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Published package version to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Wolfsblvt/wolfsblvt-icons' &&
      github.ref_type == 'tag' &&
      github.ref_name != 'v0.1.0'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm 11.20.0
        run: npm install --global npm@11.20.0 --ignore-scripts

      - name: Verify the tagged release source
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          test "$EXPECTED_TAG" = "v$package_version"
          test -n "$package_name"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Verify the package
        run: npm test

      - name: Inspect the publish tarball
        run: npm run pack:check

      - name: Publish from the tagged source
        run: npm publish --provenance --access public

  verify-published-package:
    needs: publish
    if: >-
      always() && github.repository == 'Wolfsblvt/wolfsblvt-icons' &&
      ((github.event_name == 'push' &&
        ((github.ref_name == 'v0.1.0' && needs.publish.result == 'skipped') ||
         (github.ref_name != 'v0.1.0' && needs.publish.result == 'success'))) ||
       (github.event_name == 'workflow_dispatch' && inputs.version != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm 11.20.0
        run: npm install --global npm@11.20.0 --ignore-scripts

      - name: Verify the registry artifact and target attestation
        env:
          PACKAGE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="${PACKAGE_VERSION#v}"
          for attempt in $(seq 1 31); do
            if npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=10000 >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 31 ]; then
              echo "Registry readback remains unavailable. Reconcile the attempt and rerun verification; do not republish."
              exit 1
            fi
            sleep 30
          done
          expect_provenance=true
          if [ "$package_version" = "0.1.0" ]; then
            expect_provenance=false
          fi
          npm run pack:consumer -- \
            --registry-package="$package_name@$package_version" \
            --expect-provenance="$expect_provenance"
