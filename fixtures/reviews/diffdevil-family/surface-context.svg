<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1020" viewBox="0 0 1740 1020" role="img" aria-labelledby="title desc"><title id="title">diffdevil icon family in product surfaces</title><desc id="desc">Proposed Changed, raw churn, and bands glyphs in website, extension, playground, and dashboard contexts, beside ordinary Lucide interface icons.</desc><style>
