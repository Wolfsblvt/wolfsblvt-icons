ettings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></symbol></defs><rect width="1740" height="1020" fill="#e8eaf0"/><g color="#171720"><text x="50" y="55" class="title">fit in the actual product, not an icon zoo</text><text x="50" y="86" class="meta">Custom glyphs carry diffdevil-only meaning. Navigation, actions, status, and provider surfaces remain Lucide or curated brands.</text></g><!-- Website metrics --><g transform="translate(50 125)" color="#f2f4f8"><rect width="1040" height="365" rx="24" fill="#161b24" stroke="#303642"/><text x="28" y="42" class="h2">Website / Playground metric cards</text><text x="1012" y="42" class="meta" text-anchor="end">dark surface · 20 px card glyphs</text><g transform="translate(28 72)"><rect width="306" height="250" rx="18" class="card"/><use href="#ctx-changed" class="stroke" x="22" y="22" width="22" height="22"/><text x="58" y="39" class="h3">Changed</text><text x="22" y="98" class="value">178</text><text x="22" y="126" class="body mono">+45  -18  ~115</text><text x="22" y="173" class="meta">Replacement-aware review surface.</text><text x="22" y="196" class="meta">One changed position counts once.</text><path d="M22 218h262" stroke="currentColor" stroke-opacity=".12"/><text x="22" y="238" class="meta mono">lines.changed</text></g><g transform="translate(367 72)"><rect width="306" height="250" rx="18" class="card"/><use href="#ctx-raw-churn" class="stroke" x="22" y="22" width="22" height="22"/><text x="58" y="39" class="h3">Raw churn</text><text x="22" y="98" class="value">293</text><text x="22" y="126" class="body mono">+160  -133</text><text x="22" y="173" class="meta">Provider-style additions and deletions.</text><text x="22" y="196" class="meta">Replacements count on both sides.</text><path d="M22 218h262" stroke="currentColor" stroke-opacity=".12"/><text x="22" y="238" class="meta mono">raw.churn</text></g><g transform="translate(706 72)"><rect width="306" height="250" rx="18" class="card"/><use href="#ctx-bands" class="stroke" x="22" y="22" width="22" height="22"/><text x="58" y="39" class="h3">Policy bands</text><text x="22" y="98" class="value">M</text><g transform="translate(22 120)" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="0" y="0" width="38" height="12" rx="2" opacity=".28"/><rect x="44" y="0" width="38" height="12" rx="2" opacity=".28"/><rect x="88" y="0" width="38" height="12" rx="2"/><rect x="132" y="0" width="38" height="12" rx="2" opacity=".28"/><rect x="176" y="0" width="38" height="12" rx="2" opacity=".28"/></g><text x="22" y="173" class="meta">A configured scale, not risk or quality.</text><text x="22" y="196" class="meta">The live rail still reflects real band count.</text><path d="M22 218h262" stroke="currentColor" stroke-opacity=".12"/><text x="22" y="238" class="meta mono">policy.bands</text></g></g><!-- Extension --><g transform="translate(1130 125)" color="#1f2328"><rect width="560" height="365" rx="24" fill="#ffffff" stroke="#d0d7de"/><text x="28" y="42" class="h2">GitHub extension</text><text x="532" y="42" class="meta" text-anchor="end">brand identity stays distinct</text><rect x="28" y="72" width="504" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><use href="#ctx-brand" class="stroke" x="46" y="96" width="18" height="18"/><text x="76" y="110" class="h3">Changed</text><text x="151" y="110" class="h3">178</text><text x="194" y="110" class="body mono">(+45 -18 ~115)</text><rect x="348" y="93" width="31" height="24" rx="12" fill="#eaeef2"/><text x="363.5" y="110" class="body" text-anchor="middle">M</text><g transform="translate(395 100)" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="0" y="0" width="14" height="8" rx="1" opacity=".25"/><rect x="18" y="0" width="14" height="8" rx="1"/><rect x="36" y="0" width="14" height="8" rx="1" opacity=".25"/><rect x="54" y="0" width="14" height="8" rx="1" opacity=".25"/></g><text x="476" y="110" class="meta">App ✓</text><text x="46" y="134" class="meta mono">Raw +160 -133</text><text x="28" y="186" class="h3">Why the custom family does not replace everything</text><g transform="translate(28 210)"><use href="#ctx-changed" class="stroke" x="0" y="0" width="20" height="20"/><text x="32" y="16" class="body">Changed cards and report sections</text><use href="#ctx-raw-churn" class="stroke" x="0" y="40" width="20" height="20"/><text x="32" y="56" class="body">Raw churn cards and settings</text><use href="#ctx-bands" class="stroke" x="0" y="80" width="20" height="20"/><text x="32" y="96" class="body">Band policy and editor entry points</text><use href="#ctx-brand" class="stroke" x="0" y="120" width="20" height="20"/><text x="32" y="136" class="body">Product provenance in the compact trigger</text></g></g><!-- Dashboard --><g transform="translate(50 530)" color="#171720"><rect width="1640" height="430" rx="24" fill="#ffffff" stroke="#d7d9e1"/><text x="28" y="42" class="h2">Future App dashboard · shared family beside ordinary Lucide controls</text><text x="1612" y="42" class="meta" text-anchor="end">illustrative information architecture, not accepted dashboard design</text><g transform="translate(28 72)"><rect width="245" height="330" rx="18" fill="#161b24"/><g color="#f2f4f8"><use href="#ctx-brand" class="stroke" x="22" y="22" width="22" height="22"/><text x="58" y="39" class="h3">diffdevil</text><rect x="14" y="64" width="217" height="42" rx="9" fill="#e54eaf" fill-opacity=".16"/><use href="#ctx-layout-dashboard" class="stroke" x="25" y="75" width="20" height="20"/><text x="58" y="91" class="body">Overview</text><use href="#ctx-folder-git-2" class="stroke" x="25" y="122" width="20" height="20"/><text x="58" y="138" class="body">Repositories</text><use href="#ctx-settings" class="stroke" x="25" y="169" width="20" height="20"/><text x="58" y="185" class="body">Policy</text><use href="#ctx-list-checks" class="stroke" x="25" y="216" width="20" height="20"/><text x="58" y="232" class="body">Analyses</text><use href="#ctx-workflow" class="stroke" x="25" y="263" width="20" height="20"/><text x="58" y="279" class="body">Operations</text></g></g><g transform="translate(304 72)"><text x="0" y="24" class="h3">Repository / pull request #482</text><text x="0" y="49" class="meta">Exact report · repository policy · current head</text><g transform="translate(0 78)"><rect width="385" height="112" rx="16" class="card"/><use href="#ctx-changed" class="stroke" x="22" y="22" width="24" height="24"/><text x="60" y="41" class="h3">Changed</text><text x="22" y="88" class="value">178</text><text x="114" y="85" class="body mono">+45 -18 ~115</text></g><g transform="translate(410 78)"><rect width="385" height="112" rx="16" class="card"/><use href="#ctx-raw-churn" class="stroke" x="22" y="22" width="24" height="24"/><text x="60" y="41" class="h3">Raw churn</text><text x="22" y="88" class="value">293</text><text x="114" y="85" class="body mono">+160 -133</text></g><g transform="translate(820 78)"><rect width="385" height="112" rx="16" class="card"/><use href="#ctx-bands" class="stroke" x="22" y="22" width="24" height="24"/><text x="60" y="41" class="h3">Selected band</text><text x="22" y="88" class="value">M</text><text x="76" y="85" class="body">100–499 changed lines</text></g><g transform="translate(0 214)"><rect width="1205" height="116" rx="16" class="card"/><text x="22" y="35" class="h3">Ordinary concepts remain ordinary icons</text><use href="#ctx-file-diff" class="stroke" x="24" y="58" width="20" height="20"/><text x="55" y="74" class="body">Report</text><use href="#ctx-list-checks" class="stroke" x="160" y="58" width="20" height="20"/><text x="191" y="74" class="body">Checks</text><use href="#ctx-workflow" class="stroke" x="295" y="58" width="20" height="20"/><text x="326" y="74" class="body">Effects</text><use href="#ctx-settings" class="stroke" x="430" y="58" width="20" height="20"/><text x="461" y="74" class="body">Settings</text><use href="#ctx-layout-dashboard" class="stroke" x="585" y="58" width="20" height="20"/><text x="616" y="74" class="body">Dashboard</text><text x="1168" y="74" class="meta" text-anchor="end">Lucide already solved these. Let it.</text></g></g></g></svg>
