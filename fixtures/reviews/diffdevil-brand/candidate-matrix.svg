<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title description">
<title id="title">diffdevil brand-derived candidate matrix</title>
<desc id="description">Three line-glyph translations of the existing diffdevil identity at 14, 16, 20, 24, and 32 pixels on light and dark surfaces, including square and circular reference containers.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.title{font-size:32px;font-weight:760;letter-spacing:-.6px}
.section{font-size:19px;font-weight:720}
.name{font-size:16px;font-weight:680}
.meta{font-size:13px;opacity:.68}
.tiny{font-size:11px;opacity:.66}
.stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.container{fill:none;stroke:currentColor;stroke-opacity:.22;stroke-width:1.5}
</style>
<defs><symbol id="a-split-outline" viewBox="0 0 24 24">  <path d="M4 4l3 2.25V9h4v11H6a2 2 0 0 1-2-2Z" />
  <path d="M20 4l-3 2.25V9h-4v11h5a2 2 0 0 0 2-2Z" />
  <path d="M6.5 13h3" />
  <path d="M14.5 13h3" />
  <path d="M16 11.5v3" /></symbol><symbol id="b-center-seam" viewBox="0 0 24 24">  <path d="M4 4l3 2.25V9h10V6.25L20 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" />
  <path d="M12 9v11" />
  <path d="M6.5 13h3" />
  <path d="M14.5 13h3" />
  <path d="M16 11.5v3" /></symbol><symbol id="c-minimal-face" viewBox="0 0 24 24">  <path d="M4 4l3 2.25V9h10V6.25L20 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" />
  <path d="M6.5 13h3" />
  <path d="M14.5 13h3" />
  <path d="M16 11.5v3" /></symbol></defs>
<rect width="1600" height="780" fill="#ececf2"/>
<text x="50" y="52" class="title" fill="#171720">diffdevil/brand · identity translation</text>
<text x="50" y="82" class="meta" fill="#52525e">Iteration 2 · all candidates retain the horned split-face silhouette and − / + eyes from the existing symbol</text>
<g transform="translate(50 125)" color="#171720" fill="currentColor">
  <rect width="735" height="580" rx="24" fill="#ffffff" stroke="#d9d9e2"/>
  <text x="24" y="42" class="section">Light surface</text>
  <text x="705" y="42" class="meta" text-anchor="end">14 · 16 · 20 · 24 · 32 · square · circle</text>
  <text x="24" y="100" class="name">A · Split outline</text><text x="24" y="124" class="meta">Closest structural translation</text><use href="#a-split-outline" class="stroke" x="220" y="82.0" width="14" height="14"/><text x="227.0" y="150" class="tiny" text-anchor="middle">14</text><use href="#a-split-outline" class="stroke" x="285" y="81.0" width="16" height="16"/><text x="293.0" y="150" class="tiny" text-anchor="middle">16</text><use href="#a-split-outline" class="stroke" x="355" y="79.0" width="20" height="20"/><text x="365.0" y="150" class="tiny" text-anchor="middle">20</text><use href="#a-split-outline" class="stroke" x="430" y="77.0" width="24" height="24"/><text x="442.0" y="150" class="tiny" text-anchor="middle">24</text><use href="#a-split-outline" class="stroke" x="515" y="73.0" width="32" height="32"/><text x="531.0" y="150" class="tiny" text-anchor="middle">32</text><rect x="590" y="68" width="44" height="44" rx="7" class="container"/><use href="#a-split-outline" class="stroke" x="600" y="78" width="24" height="24"/><circle cx="674" cy="90" r="22" class="container"/><use href="#a-split-outline" class="stroke" x="662" y="78" width="24" height="24"/><text x="24" y="250" class="name">B · Centre seam</text><text x="24" y="274" class="meta">Best identity / clarity balance</text><use href="#b-center-seam" class="stroke" x="220" y="232.0" width="14" height="14"/><text x="227.0" y="300" class="tiny" text-anchor="middle">14</text><use href="#b-center-seam" class="stroke" x="285" y="231.0" width="16" height="16"/><text x="293.0" y="300" class="tiny" text-anchor="middle">16</text><use href="#b-center-seam" class="stroke" x="355" y="229.0" width="20" height="20"/><text x="365.0" y="300" class="tiny" text-anchor="middle">20</text><use href="#b-center-seam" class="stroke" x="430" y="227.0" width="24" height="24"/><text x="442.0" y="300" class="tiny" text-anchor="middle">24</text><use href="#b-center-seam" class="stroke" x="515" y="223.0" width="32" height="32"/><text x="531.0" y="300" class="tiny" text-anchor="middle">32</text><rect x="590" y="218" width="44" height="44" rx="7" class="container"/><use href="#b-center-seam" class="stroke" x="600" y="228" width="24" height="24"/><circle cx="674" cy="240" r="22" class="container"/><use href="#b-center-seam" class="stroke" x="662" y="228" width="24" height="24"/><text x="24" y="400" class="name">C · Minimal face</text><text x="24" y="424" class="meta">Lightest and most subtle</text><use href="#c-minimal-face" class="stroke" x="220" y="382.0" width="14" height="14"/><text x="227.0" y="450" class="tiny" text-anchor="middle">14</text><use href="#c-minimal-face" class="stroke" x="285" y="381.0" width="16" height="16"/><text x="293.0" y="450" class="tiny" text-anchor="middle">16</text><use href="#c-minimal-face" class="stroke" x="355" y="379.0" width="20" height="20"/><text x="365.0" y="450" class="tiny" text-anchor="middle">20</text><use href="#c-minimal-face" class="stroke" x="430" y="377.0" width="24" height="24"/><text x="442.0" y="450" class="tiny" text-anchor="middle">24</text><use href="#c-minimal-face" class="stroke" x="515" y="373.0" width="32" height="32"/><text x="531.0" y="450" class="tiny" text-anchor="middle">32</text><rect x="590" y="368" width="44" height="44" rx="7" class="container"/><use href="#c-minimal-face" class="stroke" x="600" y="378" width="24" height="24"/><circle cx="674" cy="390" r="22" class="container"/><use href="#c-minimal-face" class="stroke" x="662" y="378" width="24" height="24"/>
</g>
<text x="50" y="745" class="meta" fill="#52525e">The choice is no longer “which product feature should the icon explain?” It is “how much of the existing diffdevil identity survives the Lucide translation?”</text>
</svg>
