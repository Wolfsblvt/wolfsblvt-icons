name: Bootstrap source evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Reproduce bootstrap candidate
        run: |
          npm install --ignore-scripts
          npm run format
          npm test
          git diff --check
          git diff --binary > /tmp/bootstrap.patch

      - name: Emit bootstrap evidence
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";

          for (const [label, path] of [
            ["LOCK", "package-lock.json"],
            ["PATCH", "/tmp/bootstrap.patch"],
          ]) {
            const payload = readFileSync(path).toString("base64");
            const chunkSize = 6000;
            for (let offset = 0, index = 0; offset < payload.length; offset += chunkSize, index += 1) {
              console.log(`${label}_CHUNK_${String(index).padStart(3, "0")}:${payload.slice(offset, offset + chunkSize)}`);
            }
          }
          NODE
