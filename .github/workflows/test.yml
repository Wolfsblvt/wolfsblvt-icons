name: Final repair evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: repair
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare and verify repair
        run: |
          npm ci --ignore-scripts
          npm run format
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "tests/svg-validation.test.mjs";
          const source = readFileSync(path, "utf8");
          const repaired = source.replace(
            "/comments, declarations, entities, and processing instructions are forbidden/",
            "/Comments, declarations, entities, and processing instructions are forbidden/",
          );
          if (repaired === source) {
            throw new Error("Expected comment-validator assertion was not found.");
          }
          writeFileSync(path, repaired);
          NODE
          git diff --binary > /tmp/repair.patch
          npm test
          git diff --check

      - name: Emit repair patch
        if: always()
        run: |
          if [ ! -f /tmp/repair.patch ]; then
            echo "Repair patch was not produced."
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const payload = readFileSync("/tmp/repair.patch").toString("base64");
          const chunkSize = 6000;
          for (let offset = 0, index = 0; offset < payload.length; offset += chunkSize, index += 1) {
            console.log(`PATCH_CHUNK_${String(index).padStart(3, "0")}:${payload.slice(offset, offset + chunkSize)}`);
          }
          NODE
