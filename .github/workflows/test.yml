name: Finalize repository bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    name: finalize
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve and format bootstrap candidate
        run: |
          npm install --ignore-scripts
          npm run format
          npm test

      - name: Install final read-only workflow
        run: |
          cat > .github/workflows/test.yml <<'WORKFLOW'
          name: Tests

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              name: verify
              runs-on: ubuntu-latest
              steps:
                - name: Check out source
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

                - name: Use Node.js 24
                  uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                  with:
                    node-version: 24
                    cache: npm
                    cache-dependency-path: package-lock.json

                - name: Install dependencies
                  run: npm ci --ignore-scripts

                - name: Verify repository
                  run: npm test
          WORKFLOW

      - name: Requalify exact final tree
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts
          npm test
          git diff --check

      - name: Commit final bootstrap outputs
        run: |
          git config user.name "Nyxara"
          git config user.email "nyxara@agents.wolfsblvt.com"
          git add -A
          git commit -F - <<'MESSAGE'
          chore: lock and qualify repository dependencies

          Co-authored-via: Nyxara | ChatGPT Web | GPT-5.6 Sol | Pro
          Co-authored-by: Nyxara <nyxara@agents.wolfsblvt.com>
          MESSAGE
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
